name: LegadoCustom

on: 
  workflow_dispatch:
    inputs: 
      git_url: 
        description: 'legado git url'      
        required: true 
        default: 'https://github.com/Summer1Solstice/legado.git'
      git_tag:
        description: '需要构建的 tag'      
        required: true 
        default: '3.25'
      app_custom:
        description: '自定义脚本'      
        required: true 
        default: 'diy_test.sh'
      app_name: 
        description: '应用名称'      
        required: true 
        default: 'legado'
      app_suffix: 
        description: '包名后缀'      
        required: true 
        default: 'A'
      app_launch_name: 
        description: '桌面名称'      
        required: true 
        default: '阅读.A'

jobs:
  build_apk:
    if: github.repository_owner == github.actor
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Enable debug logging
      run: |
        echo "ACTIONS_RUNNER_DEBUG=true" >> $GITHUB_ENV
        echo "ACTIONS_STEP_DEBUG=true" >> $GITHUB_ENV
    
    - name: setup JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: 17
        
    - name: setup Gradle
      uses: gradle/gradle-build-action@v2.4.2
      
    - name: set env
      shell: bash
      env:
        SECRETS_APP_NAME: ${{ github.event.inputs.app_name }}
        SECRETS_GIT_URL: ${{ github.event.inputs.git_url }}
        SECRETS_SUFFIX: ${{ github.event.inputs.app_suffix }}
        SECRETS_MINIFY: ${{ secrets.MINIFY }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_ACTOR: ${{ github.actor }}
        SECRETS_TAG: ${{ github.event.inputs.git_tag }}
      run: source $GITHUB_WORKSPACE/action_setenv.sh
    
    - name: clone code
      shell: bash
      run: source $GITHUB_WORKSPACE/action_clone.sh

    - name: custom your app
      shell: bash
      env:
        custom: ${{ github.event.inputs.app_custom }}
      run: |
        source $GITHUB_WORKSPACE/diy/$custom
        
    - name: build  your app
      if: success()
      shell: bash
      run: |
        source $GITHUB_WORKSPACE/action_app_build.sh
        app_build

    - name: upload artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ${{ env.APP_UPLOAD_NAME }}
        path: ${{ env.APP_UPLOAD }}